<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login • HabbitTracker</title>
    <meta name="description" content="Sign in to HabbitTracker to manage daily habits, review progress and continue your focus sessions." />
    <meta name="author" content="TheBenzzCreations" />
    <meta name="creator" content="TheBenzzCreations" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HabbitTracker" />
    <meta property="og:title" content="Login • HabbitTracker" />
    <meta property="og:description" content="Sign in to HabbitTracker to manage daily habits, review progress and continue your focus sessions." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Login • HabbitTracker" />
    <meta name="twitter:description" content="Sign in to HabbitTracker to manage daily habits, review progress and continue your focus sessions." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="../assets/css/theme.css" rel="stylesheet" />
    <link href="../assets/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar hx-nav sticky-top">
      <div class="container py-2">
        <a class="hx-brand" href="../index.html">
          <img src="../assets/img/one1-mark.svg" alt="Only 1" />
          <div class="d-flex flex-column lh-1">
            <span class="t1">HabbitTracker</span>
            <span class="t2">Only 1 Mode</span>
          </div>
        </a>
        <div class="d-flex gap-2">
          <a class="btn hx-btn hx-btn-ghost" href="./register.html">Create account</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="hx-card p-4 p-md-5 hx-border-grad">
            <div class="hx-chip mb-3"><i class="bi bi-box-arrow-in-right"></i> Sign in</div>
            <h1 class="hx-hero-title h3 mb-1">Welcome back</h1>
            <div class="text-secondary mb-4">Enter the cockpit. Today counts.</div>

            <form id="loginForm" class="vstack gap-3">
              <div>
                <label class="form-label text-secondary small">Email</label>
                <input id="email" class="form-control" type="email" autocomplete="email" required placeholder="you@example.com" />
              </div>
              <div>
                <label class="form-label text-secondary small">Password</label>
                <input id="password" class="form-control" type="password" autocomplete="current-password" required placeholder="••••••••" />
              </div>
              <button id="loginBtn" class="btn hx-btn hx-btn-primary w-100" type="submit">
                <i class="bi bi-lightning-charge-fill me-2"></i>Login
              </button>
            </form>

            <div class="mt-3">
              <a class="hx-link text-secondary small" data-bs-toggle="collapse" href="#advancedConn">Advanced connection</a>
              <div class="collapse mt-2" id="advancedConn">
                <label class="form-label text-secondary small">Backend URL</label>
                <div class="d-flex gap-2">
                  <input id="baseUrl" class="form-control" placeholder="http://localhost:8080" />
                  <button id="saveBaseUrlBtn" class="btn hx-btn hx-btn-ghost" type="button">Save</button>
                </div>
                <div class="text-secondary small mt-2">
                  If you see CORS errors, your backend must allow your frontend origin (example: <span class="fw-semibold">http://127.0.0.1:5500</span>).
                </div>
              </div>
            </div>

            <div class="text-secondary small mt-4">
              No account? <a class="hx-link" href="./register.html">Register</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../src/js/pages/login.js"></script>
  </body>
</html>
