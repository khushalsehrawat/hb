<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register • HabbitTracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="../assets/css/theme.css" rel="stylesheet" />
    <link href="../assets/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar hx-nav sticky-top">
      <div class="container py-2">
        <a class="hx-brand" href="../index.html">
          <img src="../assets/img/one1-mark.svg" alt="Only 1" />
          <div class="d-flex flex-column lh-1">
            <span class="t1">HabbitTracker</span>
            <span class="t2">Only 1 Mode</span>
          </div>
        </a>
        <div class="d-flex gap-2">
          <a class="btn hx-btn hx-btn-ghost" href="./login.html">Login</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="hx-card p-4 p-md-5 hx-border-grad">
            <div class="hx-chip mb-3"><i class="bi bi-rocket-takeoff"></i> Create account</div>
            <h1 class="hx-hero-title h3 mb-1">Start Only 1 Mode</h1>
            <div class="text-secondary mb-4">A clean setup: name, email, timezone, and a lock time.</div>

            <form id="registerForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-secondary small">Full name</label>
                <input id="fullName" class="form-control" autocomplete="name" required placeholder="Your name" />
              </div>
              <div class="col-md-6">
                <label class="form-label text-secondary small">Email</label>
                <input id="email" class="form-control" type="email" autocomplete="email" required placeholder="you@example.com" />
              </div>
              <div class="col-md-6">
                <label class="form-label text-secondary small">Password</label>
                <input id="password" class="form-control" type="password" autocomplete="new-password" required placeholder="Choose strong password" />
              </div>
              <div class="col-md-3">
                <label class="form-label text-secondary small">Auto-save time</label>
                <input id="autoSaveTime" class="form-control" type="time" value="23:00" required />
              </div>
              <div class="col-md-3">
                <label class="form-label text-secondary small">Timezone</label>
                <input id="timeZoneId" class="form-control" placeholder="Asia/Kolkata" required />
              </div>

              <div class="col-12">
                <button id="registerBtn" class="btn hx-btn hx-btn-primary w-100" type="submit">
                  <i class="bi bi-stars me-2"></i>Create account
                </button>
              </div>
            </form>

            <div class="mt-3">
              <a class="hx-link text-secondary small" data-bs-toggle="collapse" href="#advancedConn">Advanced connection</a>
              <div class="collapse mt-2" id="advancedConn">
                <label class="form-label text-secondary small">Backend URL</label>
                <div class="d-flex gap-2">
                  <input id="baseUrl" class="form-control" placeholder="http://localhost:8080" />
                  <button id="saveBaseUrlBtn" class="btn hx-btn hx-btn-ghost" type="button">Save</button>
                </div>
                <div class="text-secondary small mt-2">
                  If you see CORS errors, your backend must allow your frontend origin (example: <span class="fw-semibold">http://127.0.0.1:5500</span>).
                </div>
              </div>
            </div>

            <div class="text-secondary small mt-4">
              Already have an account? <a class="hx-link" href="./login.html">Login</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../src/js/pages/register.js"></script>
  </body>
</html>
