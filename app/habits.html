<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habits • HabbitTracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="../assets/css/theme.css" rel="stylesheet" />
    <link href="../assets/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="d-flex" style="min-height:100vh">
      <aside class="hx-sidebar d-none d-lg-flex flex-column p-3" style="width:300px">
        <a class="hx-brand mb-3" href="../index.html">
          <img src="../assets/img/one1-mark.svg" alt="Only 1" />
          <div class="d-flex flex-column lh-1">
            <span class="t1">HabbitTracker</span>
            <span class="t2">Only 1 Mode</span>
          </div>
        </a>
        <div class="hx-card p-3 mb-3">
          <div class="d-flex align-items-center gap-3">
            <div
              class="rounded-circle d-grid place-items-center"
              data-hx-avatar
              style="width:42px;height:42px;background:var(--hx-grad);border:1px solid rgba(11,18,32,.10);font-weight:800"
            ></div>
            <div class="min-w-0">
              <div class="fw-semibold text-truncate" data-hx-user>—</div>
              <div class="text-secondary small text-truncate" data-hx-email>—</div>
            </div>
          </div>
        </div>
        <nav class="vstack gap-1">
          <a class="hx-side-link" data-hx-nav="dashboard" href="./dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a class="hx-side-link" data-hx-nav="habits" href="./habits.html"><i class="bi bi-list-check"></i>Habits</a>
          <a class="hx-side-link" data-hx-nav="insights" href="./insights.html"><i class="bi bi-graph-up"></i>Insights</a>
          <a class="hx-side-link" data-hx-nav="focus" href="./focus.html"><i class="bi bi-stopwatch"></i>Focus</a>
          <a class="hx-side-link" data-hx-nav="settings" href="./settings.html"><i class="bi bi-gear"></i>Settings</a>
        </nav>
        <div class="mt-auto pt-3">
          <a class="btn hx-btn hx-btn-ghost w-100" href="#" data-hx-logout><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </div>
      </aside>

      <main class="flex-grow-1">
        <div class="hx-nav">
          <div class="container-fluid py-3 px-3 px-lg-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
              <button class="btn hx-btn hx-btn-ghost d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileNav">
                <i class="bi bi-list"></i>
              </button>
              <div>
                <div class="fw-semibold" data-hx-page-title>Habits</div>
                <div class="text-secondary small">Build. Break. Repeat. With precision.</div>
              </div>
            </div>
            <button id="newHabitBtn" class="btn hx-btn hx-btn-primary"><i class="bi bi-plus-lg me-2"></i>New habit</button>
          </div>
        </div>

        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="row g-4" id="habitsHost"></div>
        </div>
      </main>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileNav">
      <div class="offcanvas-header">
        <a class="hx-brand" href="../index.html">
          <img src="../assets/img/one1-mark.svg" alt="Only 1" />
          <div class="d-flex flex-column lh-1">
            <span class="t1">HabbitTracker</span>
            <span class="t2">Only 1 Mode</span>
          </div>
        </a>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <nav class="vstack gap-1">
          <a class="hx-side-link" data-hx-nav="dashboard" href="./dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a class="hx-side-link" data-hx-nav="habits" href="./habits.html"><i class="bi bi-list-check"></i>Habits</a>
          <a class="hx-side-link" data-hx-nav="insights" href="./insights.html"><i class="bi bi-graph-up"></i>Insights</a>
          <a class="hx-side-link" data-hx-nav="focus" href="./focus.html"><i class="bi bi-stopwatch"></i>Focus</a>
          <a class="hx-side-link" data-hx-nav="settings" href="./settings.html"><i class="bi bi-gear"></i>Settings</a>
        </nav>
        <div class="mt-3">
          <a class="btn hx-btn hx-btn-ghost w-100" href="#" data-hx-logout><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </div>
      </div>
    </div>

    <div class="modal fade" id="habitModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content hx-card p-2">
          <div class="modal-header border-0">
            <h5 class="modal-title hx-hero-title" id="habitModalTitle">Create Habit</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="habitForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-secondary small">Title</label>
                <input id="h_title" class="form-control" required placeholder="Morning workout" />
              </div>
              <div class="col-md-6">
                <label class="form-label text-secondary small">Category</label>
                <select id="h_category" class="form-select" required>
                  <option>HEALTH</option>
                  <option>STUDY</option>
                  <option>WORK</option>
                  <option>PERSONAL</option>
                  <option>FINANCE</option>
                  <option>SOCIAL</option>
                  <option>MINDFULNESS</option>
                  <option>SLEEP</option>
                  <option>NUTRITION</option>
                  <option>OTHER</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label text-secondary small">Description</label>
                <input id="h_description" class="form-control" placeholder="Short and clear" />
              </div>
              <div class="col-md-4">
                <label class="form-label text-secondary small">Type</label>
                <select id="h_type" class="form-select" required>
                  <option>BUILD</option>
                  <option>BREAK</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label text-secondary small">Frequency</label>
                <select id="h_frequencyType" class="form-select" required>
                  <option>DAILY</option>
                  <option>X_PER_WEEK</option>
                  <option>X_PER_MONTH</option>
                  <option>SPECIFIC_DAYS_OF_WEEK</option>
                </select>
              </div>
              <div class="col-md-4" id="h_frequencyValueRow">
                <label class="form-label text-secondary small">Frequency value</label>
                <input id="h_frequencyValue" class="form-control" type="number" min="1" placeholder="5" />
              </div>
              <div class="col-12 d-none" id="h_daysOfWeekRow">
                <label class="form-label text-secondary small">Days of week</label>
                <input id="h_daysOfWeek" class="form-control" placeholder="MONDAY,WEDNESDAY,FRIDAY" />
              </div>
              <div class="col-md-6">
                <label class="form-label text-secondary small">Target value (optional)</label>
                <input id="h_targetValue" class="form-control" type="number" min="1" placeholder="30" />
              </div>
              <div class="col-md-6">
                <label class="form-label text-secondary small">Unit (optional)</label>
                <input id="h_unit" class="form-control" placeholder="minutes" />
              </div>
              <div class="col-12">
                <button id="habitSaveBtn" class="btn hx-btn hx-btn-primary w-100" type="submit">
                  <i class="bi bi-check2-circle me-2"></i>Save
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../src/js/pages/habits.js"></script>
  </body>
</html>
