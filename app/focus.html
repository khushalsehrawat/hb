<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus • HabbitTracker</title>
    <meta name="description" content="Start focus sessions, link them to habits and review today&#x27;s sessions in HabbitTracker." />
    <meta name="author" content="TheBenzzCreations" />
    <meta name="creator" content="TheBenzzCreations" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HabbitTracker" />
    <meta property="og:title" content="Focus • HabbitTracker" />
    <meta property="og:description" content="Start focus sessions, link them to habits and review today&#x27;s sessions in HabbitTracker." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Focus • HabbitTracker" />
    <meta name="twitter:description" content="Start focus sessions, link them to habits and review today&#x27;s sessions in HabbitTracker." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="../assets/css/theme.css" rel="stylesheet" />
    <link href="../assets/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="d-flex" style="min-height:100vh">
      <aside class="hx-sidebar d-none d-lg-flex flex-column p-3" style="width:300px">
        <a class="hx-brand mb-3" href="../index.html">
          <img src="../assets/img/one1-mark.svg" alt="Only 1" />
          <div class="d-flex flex-column lh-1">
            <span class="t1">HabbitTracker</span>
            <span class="t2">Only 1 Mode</span>
          </div>
        </a>
        <div class="hx-card p-3 mb-3">
          <div class="d-flex align-items-center gap-3">
            <div
              class="rounded-circle d-grid place-items-center"
              data-hx-avatar
              style="width:42px;height:42px;background:var(--hx-grad);border:1px solid rgba(11,18,32,.10);font-weight:800"
            ></div>
            <div class="min-w-0">
              <div class="fw-semibold text-truncate" data-hx-user>—</div>
              <div class="text-secondary small text-truncate" data-hx-email>—</div>
            </div>
          </div>
        </div>
        <nav class="vstack gap-1">
          <a class="hx-side-link" data-hx-nav="dashboard" href="./dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a class="hx-side-link" data-hx-nav="habits" href="./habits.html"><i class="bi bi-list-check"></i>Habits</a>
          <a class="hx-side-link" data-hx-nav="insights" href="./insights.html"><i class="bi bi-graph-up"></i>Insights</a>
          <a class="hx-side-link" data-hx-nav="focus" href="./focus.html"><i class="bi bi-stopwatch"></i>Focus</a>
          <a class="hx-side-link" data-hx-nav="settings" href="./settings.html"><i class="bi bi-gear"></i>Settings</a>
        </nav>
        <div class="mt-auto pt-3">
          <a class="btn hx-btn hx-btn-ghost w-100" href="#" data-hx-logout><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </div>
      </aside>

      <main class="flex-grow-1">
        <div class="hx-nav">
          <div class="container-fluid py-3 px-3 px-lg-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
              <button class="btn hx-btn hx-btn-ghost d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileNav">
                <i class="bi bi-list"></i>
              </button>
              <div>
                <div class="fw-semibold" data-hx-page-title>Focus</div>
                <div class="text-secondary small">Deep work, zero drift.</div>
              </div>
            </div>
          </div>
        </div>

        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="row g-4">
            <div class="col-xl-5">
              <div class="hx-card p-4 hx-border-grad">
                <div class="fw-semibold mb-1">Start a session</div>
                <div class="text-secondary small">Label it, optionally link it to a habit.</div>
                <div class="hx-mini-divider my-3"></div>
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label text-secondary small">Label</label>
                    <input id="focusLabel" class="form-control" placeholder="Deep work on DSA" />
                  </div>
                  <div class="col-12">
                    <label class="form-label text-secondary small">Link to habit (optional)</label>
                    <select id="focusHabit" class="form-select"></select>
                  </div>
                  <div class="col-12">
                    <button id="startBtn" class="btn hx-btn hx-btn-primary w-100"><i class="bi bi-play-fill me-2"></i>Start</button>
                  </div>
                </div>
              </div>

              <div class="mt-4" id="activeHost"></div>
            </div>

            <div class="col-xl-7">
              <div class="hx-card p-4 hx-border-grad">
                <div class="fw-semibold mb-2">Today’s sessions</div>
                <div class="text-secondary small">A clean log of focus laps for today.</div>
                <div class="hx-mini-divider my-3"></div>
                <div id="sessionsHost"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileNav">
      <div class="offcanvas-header">
        <a class="hx-brand" href="../index.html">
          <img src="../assets/img/one1-mark.svg" alt="Only 1" />
          <div class="d-flex flex-column lh-1">
            <span class="t1">HabbitTracker</span>
            <span class="t2">Only 1 Mode</span>
          </div>
        </a>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <nav class="vstack gap-1">
          <a class="hx-side-link" data-hx-nav="dashboard" href="./dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a class="hx-side-link" data-hx-nav="habits" href="./habits.html"><i class="bi bi-list-check"></i>Habits</a>
          <a class="hx-side-link" data-hx-nav="insights" href="./insights.html"><i class="bi bi-graph-up"></i>Insights</a>
          <a class="hx-side-link" data-hx-nav="focus" href="./focus.html"><i class="bi bi-stopwatch"></i>Focus</a>
          <a class="hx-side-link" data-hx-nav="settings" href="./settings.html"><i class="bi bi-gear"></i>Settings</a>
        </nav>
        <div class="mt-3">
          <a class="btn hx-btn hx-btn-ghost w-100" href="#" data-hx-logout><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../src/js/pages/focus.js"></script>
  </body>
</html>
